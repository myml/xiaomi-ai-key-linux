name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is still what RHEL 9 / CentOS Stream 9 ship, but the current
        # ubuntu-latest image (26.04) has no 3.9 build, hence the pin.
        include:
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: shellcheck + byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell syntax and shellcheck
        run: |
          for script in scripts/*.sh; do
            echo "== $script"
            bash -n "$script"
            shellcheck -x "$script"
          done
      - name: Byte-compile
        run: python -m compileall -q bin tests

  packaging:
    name: shipped files are consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Packaging tests
        run: python -m unittest tests.test_packaging -v
      - name: Makefile builds a tarball
        run: make dist && tar tzf dist/*.tar.gz | head -20
